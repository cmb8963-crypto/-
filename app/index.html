<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>מערכת ניהול</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2396723F'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='serif'%3Eב%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<noscript>יש להפעיל JavaScript כדי להשתמש במערכת.</noscript>

<!-- Login -->
<section id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="logo-mark">ב</div>
    <h1>מערכת ניהול</h1>
    <p id="gateSub">כניסה פרטית</p>
    <form id="loginForm" autocomplete="on">
      <div class="field" id="codeField" hidden>
        <label for="setupCode">קוד הגדרה חד-פעמי (מהיומן של Apps Script)</label>
        <input id="setupCode" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="pw" id="pwLabel">סיסמה</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <div class="field" id="pw2Field" hidden>
        <label for="pw2">אימות סיסמה</label>
        <input id="pw2" type="password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">כניסה</button>
    </form>
    <div class="gate-err" id="gateErr" role="alert"></div>
    <div class="small muted" id="gateNote" style="margin-top:14px"></div>
  </div>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#biz/dashboard"><span class="logo-mark sm">ב</span><span class="brand-t">מערכת ניהול</span></a>
      <nav class="maintabs" id="mainTabs" aria-label="ניווט ראשי">
        <a href="#biz/dashboard" data-top="biz">ניהול העסק</a>
        <a href="#family/overview" data-top="family">כלכלת המשפחה</a>
        <a href="#diag" data-top="diag">אבחון</a>
      </nav>
      <div class="top-actions">
        <span class="badge warn" id="demoBadge" hidden>מצב הדגמה</span>
        <a class="icon-btn" href="#settings" title="הגדרות" aria-label="הגדרות">⚙</a>
        <button class="icon-btn" data-act="logout" title="יציאה" aria-label="יציאה">⎋</button>
      </div>
    </div>
    <nav class="subtabs" id="subTabs" aria-label="ניווט משני"></nav>
  </header>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../shared/config.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/email-templates.js"></script>
<script src="../shared/api.js"></script>
<script src="importers.js"></script>
<script src="ui.js"></script>
<script src="business.js"></script>
<script src="family.js"></script>
<script src="app.js"></script>
</body>
</html>
